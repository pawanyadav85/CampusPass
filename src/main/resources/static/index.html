<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusPass — Digital Student Permission & Gate Movement System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <i class="bi bi-shield-lock-fill me-2 fs-4 text-info"></i>
        <span>CampusPass</span>
        <span class="brand-badge">Official College Portal</span>
      </a>
      <span class="navbar-text text-light small d-none d-md-block">
        Apex Institute of Engineering & Technology
      </span>
    </div>
  </nav>

  <main class="container my-auto py-5">
    <div class="row justify-content-center align-items-center">
      <div class="col-lg-6 col-md-8">
        
        <div class="card p-4 p-md-5 shadow-sm border-0">
          <div class="text-center mb-4">
            <div class="display-6 fw-bold text-primary mb-2">CampusPass</div>
            <p class="text-muted">Digital Student Permission & Gate Movement Management System</p>
          </div>

          <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username / Roll Number</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" required placeholder="Enter username (e.g. student1, hod_cse)">
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" required placeholder="Enter password">
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
            </button>
          </form>

          <hr class="my-4">

          <div>
            <div class="small fw-bold text-uppercase text-secondary mb-2 text-center">Quick Demo Account Fill</div>
            <div class="row g-2">
              <div class="col-6">
                <button type="button" class="btn btn-outline-primary btn-sm w-100" onclick="fillCreds('student1', 'Password@123')">
                  <i class="bi bi-mortarboard me-1"></i> Student Demo
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-success btn-sm w-100" onclick="fillCreds('hod_cse', 'Password@123')">
                  <i class="bi bi-person-badge me-1"></i> HOD Demo
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-warning text-dark btn-sm w-100" onclick="fillCreds('security_gate1', 'Password@123')">
                  <i class="bi bi-shield-check me-1"></i> Security Demo
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="fillCreds('admin', 'Password@123')">
                  <i class="bi bi-gear me-1"></i> Admin Demo
                </button>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <footer class="mt-auto py-3 bg-white text-center text-muted small border-top">
    CampusPass System &copy; 2026. Built with Spring Boot, JPA, Spring Security, JWT, MySQL & Bootstrap.
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      alertBox.classList.add('d-none');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Authenticating...';

      try {
        const res = await API.post('/api/v1/auth/login', { username, password });
        API.setAuth(res.data);
        Auth.redirectByRole(res.data.role);
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid username or password';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal';
      }
    });

    // Auto-redirect if already logged in
    const existing = API.getUser();
    if (existing && API.getToken()) {
      Auth.redirectByRole(existing.role);
    }
  </script>
</body>
</html>
